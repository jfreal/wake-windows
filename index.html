      <h1>Wake Windows — Infant Nap Schedule Planner</h1>
      <p>Wake Windows is a free, evidence-checked infant nap-schedule and wake-window
        planner. Enter your baby's age, wake time, and wake windows and it builds a
        same-day nap plan with loose guidance windows — anywhere in a window counts,
        these are ranges, not deadlines. Under about 6 months (corrected age) an
        infant's circadian clock is still maturing, so sleepy cues beat clock times.</p>

      <h2>What it does</h2>
      <ul>
        <li>Generates a nap and bedtime schedule from wake windows and age.</li>
        <li>Interactive sleep troubleshooter for early waking, short naps, and false starts / split nights.</li>
        <li>Daylight-saving / timezone shift planner (ease the day over ~15 min/day).</li>
        <li>Local-first sleep &amp; nap log and a read-only sitter/grandparent share link.</li>
        <li>No account, no AI, no data sold — everything stays on your device, one-click delete.</li>
      </ul>

      <h2>Why I built this</h2>
      <p>Built by John, a parent of twins, after reading every infant-sleep book they
        could find — because the only tools available needed a login or a subscription
        when all a tired parent needs is something to say what to do next. It's
        parent-built and evidence-compiled (every recommendation carries an evidence
        tier and a citation), not a substitute for your pediatrician.</p>

      <h2>Safe sleep</h2>
      <p>Place baby fully on their back for every sleep, day and night, until age 1.
        Use a firm, flat, non-inclined surface; no soft bedding, pillows, or bumpers.
        Room-share without bed-sharing, ideally for the first 6 months.</p>

      <h2>Evidence tiers</h2>
      <p>Guidance is labelled Tier 1 (evidence-based consensus and peer-reviewed norms),
        Tier 2 (practice-based heuristic — "wake windows" are a useful estimate, not a
        validated rule), or Tier 3 (practitioner convention). Guidance last reviewed 2026-06-07.</p>

      <h2>Key sources</h2>
      <ul>
        <li><a href="https://jcsm.aasm.org/doi/full/10.5664/jcsm.5866">American Academy of Sleep Medicine — recommended sleep amounts (consensus)</a></li>
        <li><a href="https://www.sleephealthjournal.org/article/S2352-7218(15)00015-7/fulltext">National Sleep Foundation — sleep duration recommendations</a></li>
        <li><a href="https://www.who.int/publications/i/item/9789241550536">WHO — sleep guidance for children under 5</a></li>
        <li><a href="https://www.healthychildren.org/English/healthy-living/sleep/Pages/healthy-sleep-habits-how-many-hours-does-your-child-need.aspx">American Academy of Pediatrics — healthy sleep habits by age</a></li>
        <li><a href="https://publications.aap.org/pediatrics/article/150/1/e2022057990/188304/">AAP — 2022 safe-sleep recommendations (SIDS)</a></li>
        <li><a href="https://safetosleep.nichd.nih.gov/reduce-risk/reduce">NICHD "Safe to Sleep" (US NIH)</a></li>
        <li><a href="https://www.lullabytrust.org.uk/baby-safety/safer-sleep-information/safer-sleep-overview/">The Lullaby Trust (UK) — safer sleep overview</a></li>
      </ul>

      <p><small>Informational only, not medical advice. Infant sleep needs vary widely;
