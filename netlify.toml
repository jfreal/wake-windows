[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Tailwind v4's @tailwindcss/oxide requires Node >= 20
  NODE_VERSION = "20"

# F07 Offline Mode: the service worker and manifest must revalidate on every
# request, or a stale worker pins old logic/citations past a deploy. Hashed
# assets under /assets are safe to cache forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
